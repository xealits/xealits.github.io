---

<!doctype html>
<html lang="en" class="guttered">
  <head>
    <meta charset="utf-8">
    <!-- this should prevent mobile phones from randomly scaling everything -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of blogs - Alex Toldaiev - Blog</title>
    <link rel="stylesheet" href="/css/all.css">
    <link rel="stylesheet" href="/css/blog.css">
    <link rel="stylesheet" href="/css/syntax_highlighting.css">
  </head>

  <body class="colem-5">
    <section class="colem-5 clear-a-line leave-a-line">
    <nav>
      <a href="https://xealits.github.io/feed.xml">RSS feed</a>
      <div class="float-right">
        <a href="/">Home</a>
        <span class="quartergutter"> </span>
        <a href="/blog">Blog</a>
        <span class="quartergutter"> </span>
        <a href="/about">About</a>
      </div>
    </nav>
    </section>

    <section class="colem-5">
      {% for post in site.posts %}
        <article class="post-meta">
          <h1>
            <a class="nav" href="{{ post.url }}">{{ post.title }}</a>
          </h1>
          <time datetime="{{post.date}}">
            {{post.date | date: "%b %d, %Y"}}
          </time>
          <summary>
            {{ post.excerpt }}
          </summary>
          <div>
            {% if post.tags %}
              {%- for tag in post.tags -%} <a class="smallcaps nav tag" href="{{site.url}}/tags.html#{{tag | slugify}}">#{{tag}}</a> {%- endfor -%}
            {% endif %}
          </div>
        </article>

      {% endfor %}
    </section>

    <section>
        <a class="nav" href="https://xealits.github.io/feed.xml">RSS feed</a>
    </section>

  </body>
</html>
